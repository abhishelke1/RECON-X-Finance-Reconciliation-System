services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-reconx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recon} -d ${POSTGRES_DB:-reconx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-recon}:${POSTGRES_PASSWORD:-recon_secret}@db:5432/${POSTGRES_DB:-reconx}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-recon}:${POSTGRES_PASSWORD:-recon_secret}@db:5432/${POSTGRES_DB:-reconx}
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - RAZORPAY_MODE=mock
      - AUTO_RESOLVE_CONFIDENCE_THRESHOLD=0.85
      - AUTO_RESOLVE_VARIANCE_THRESHOLD_PAISE=1000
      - AUTO_RESOLVE_VARIANCE_THRESHOLD_PCT=0.5
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
